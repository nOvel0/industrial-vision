camera:
  id: cam_01
  source: data/test1.mp4
  reconnect_sec: 2

models:
  detector_path: models/yolo26n.pt
  confidence: 0.40
  imgsz: 640
  device: cpu
  classes: [0, 1, 2, 3, 5, 7]
  # 1 — каждый кадр, 2 — через кадр.
  inference_interval: 3

zones:
  restricted_01:
    - [0.15, 0.20]
    - [0.85, 0.20]
    - [0.90, 0.90]
    - [0.10, 0.90]

events:
  confirmation_n: 3
  confirmation_m: 5
  cooldown_sec: 10

storage:
  root: events
  retention_days: 30

ppe:
  model_path: models/best.pt
  confidence: 0.40
  imgsz: 640
  min_person_height: 120
  confirmation_n: 5
  confirmation_m: 7

fire_smoke:
  model_path: models/fire_smoke.pt
  confidence: 0.50
  imgsz: 640
  confirmation_n: 3
  confirmation_m: 5
  cooldown_sec: 10
  # Зона поиска дыма и огня. null — весь кадр.
  polygon:
    - [0.15, 0.20]
    - [0.85, 0.20]
    - [0.90, 0.90]
    - [0.10, 0.90]

spill:
  enabled: true
  model_path: models/spill_yolo26n-seg_new.pt
  confidence: 0.50
  imgsz: 640
  confirmation_n: 3
  confirmation_m: 5
  cooldown_sec: 10
  # Область пола. null — весь кадр.
  polygon:
    - [0.10, 0.25]
    - [0.90, 0.25]
    - [0.90, 0.95]
    - [0.10, 0.95]
